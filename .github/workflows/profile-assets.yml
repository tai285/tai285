name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output directory
        run: mkdir -p dist

      - name: Generate contribution snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: tai285
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish contribution snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # lowlighter/metrics commits its own SVG output straight to this
      # repo via the GitHub API (no checkout/push step needed), so these
      # run after the output-branch publish and write into assets/ on main.
      - name: Generate metrics card (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: tai285
          template: classic
          filename: assets/metrics-light.svg
          config_timezone: Asia/Kuala_Lumpur
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate metrics card (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: tai285
          template: classic
          theme: dark
          filename: assets/metrics-dark.svg
          config_timezone: Asia/Kuala_Lumpur
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
